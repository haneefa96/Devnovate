[project]
name = "munshi"
version = "0.1.0"
description = "AI collections agent for small Indian B2B suppliers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlmodel>=0.0.16",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "groq>=0.1.0",
    "hindsight-client>=1.0.0",
    "band-sdk>=0.1.0",
    "pydantic>=2.5.6",
    "pydantic-settings>=2.2.1",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "pytz>=2024.1",
]

[project.scripts]
munshi = "munshi.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.format]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v"
